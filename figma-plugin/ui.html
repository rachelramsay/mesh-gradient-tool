<script>
// Shader source for the animated mesh gradient.
// Kept dependency-free and WebGL1 (GLSL ES 1.00) for maximum portability.

const VERT = `
attribute vec2 aPosition;
varying vec2 vUv;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}
`;

// FRAG is a function of MAX_POINTS so the same source powers both the editor
// and the exported standalone runtime (which inlines this file verbatim).
const FRAG = (maxPoints) => `
precision highp float;
#define MAX_POINTS ${maxPoints}

varying vec2 vUv;

uniform float uTime;
uniform vec2  uResolution;
uniform float uAspect;
uniform int   uCount;
uniform vec2  uPoints[MAX_POINTS];
uniform vec3  uColors[MAX_POINTS];
uniform float uSpread[MAX_POINTS]; // per-point radius of influence

uniform float uWarp;        // domain-warp amount
uniform float uNoiseScale;  // spatial frequency of the flow
uniform float uFalloff;     // blend falloff (higher = sharper points)
uniform float uGrain;       // film grain amount
uniform float uVignette;    // corner darkening

// --- 2D simplex noise (Ashima / Stefan Gustavson, public domain) ---
vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x){ return mod289(((x * 34.0) + 1.0) * x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m; m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x  = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
  vec2 uv = vUv;
  vec2 aspect = vec2(uAspect, 1.0);

  // --- domain warp: noise offsets the sample point over time -> organic flow
  float t = uTime;
  vec2 warp = vec2(
    snoise(uv * uNoiseScale + vec2(0.0, t)),
    snoise(uv * uNoiseScale + vec2(5.2, t + 1.3))
  );
  vec2 p = uv + warp * (uWarp * 0.18);

  // --- weighted blend of all color points (inverse-distance mesh)
  vec3 color = vec3(0.0);
  float total = 0.0;
  for (int i = 0; i < MAX_POINTS; i++) {
    if (i >= uCount) break;
    vec2 d = (p - uPoints[i]) * aspect;
    float s = max(uSpread[i], 0.05);
    float dist2 = dot(d, d) / (s * s) + 0.0008; // larger spread -> wider reach
    float w = 1.0 / pow(dist2, uFalloff);
    color += uColors[i] * w; // blend in sRGB/gamma space to match Figma & CSS
    total += w;
  }
  color = color / max(total, 0.0001);

  // --- vignette
  float vig = smoothstep(1.1, 0.35, distance(uv, vec2(0.5)));
  color = mix(color, color * vig, uVignette);

  // --- film grain
  float g = fract(sin(dot(uv * uResolution + uTime, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
  color += g * uGrain;

  gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
}
`;

// Faithful bicubic mesh mode — a port of Figma's "Mesh gradient" shader (WGSL)
// to WebGL1 GLSL ES 1.00. Forward tessellation: a triangle grid in (s,t) space
// is warped by a 4x4 Catmull-Rom bicubic control net in the VERTEX shader, and
// colors are Gouraud-interpolated in linear light (like Figma), then converted
// back to sRGB in the fragment shader. Optional time-based warp adds motion.
//
// Control points are supplied as 16 entries in row-major grid order:
//   index = row*4 + col   (p_{col,row}: col=x, row=y), matching Figma's layout.

const VERT_MESH = `
attribute vec2 aST;

uniform vec2  uCtrlPos[16];   // grid positions, x/y in 0..1 (y down)
uniform vec3  uCtrlColor[16]; // grid colors, LINEAR light

varying vec3 vColor;

// --- Catmull-Rom basis ---
float cr1(float a,float b,float c,float d,float t){
  return 0.5*((2.0*b)+(-a+c)*t+(2.0*a-5.0*b+4.0*c-d)*t*t+(-a+3.0*b-3.0*c+d)*t*t*t);
}
vec2 cr2(vec2 a,vec2 b,vec2 c,vec2 d,float t){ return vec2(cr1(a.x,b.x,c.x,d.x,t),cr1(a.y,b.y,c.y,d.y,t)); }
vec3 cr3(vec3 a,vec3 b,vec3 c,vec3 d,float t){ return vec3(cr1(a.x,b.x,c.x,d.x,t),cr1(a.y,b.y,c.y,d.y,t),cr1(a.z,b.z,c.z,d.z,t)); }

// ES 1.00-safe dynamic fetch (loop counter indexing is allowed; k is dynamic).
vec2 getP(int k){ for(int n=0;n<16;n++){ if(n==k) return uCtrlPos[n]; } return uCtrlPos[15]; }
vec3 getC(int k){ for(int n=0;n<16;n++){ if(n==k) return uCtrlColor[n]; } return uCtrlColor[15]; }
int idx(int i,int j){ int ci=(i<0)?0:((i>3)?3:i); int cj=(j<0)?0:((j>3)?3:j); return cj*4+ci; }

void main(){
  float uu = aST.x*3.0; float vv = aST.y*3.0;
  int i = int(floor(uu)); i = (i<0)?0:((i>2)?2:i);
  int j = int(floor(vv)); j = (j<0)?0:((j>2)?2:j);
  float fu = uu-float(i); float fv = vv-float(j);

  vec2 prow[4]; vec3 crow[4];
  for(int m=0;m<4;m++){
    int jj = j-1+m;
    prow[m] = cr2(getP(idx(i-1,jj)), getP(idx(i,jj)), getP(idx(i+1,jj)), getP(idx(i+2,jj)), fu);
    crow[m] = cr3(getC(idx(i-1,jj)), getC(idx(i,jj)), getC(idx(i+1,jj)), getC(idx(i+2,jj)), fu);
  }
  vec2 pos = cr2(prow[0],prow[1],prow[2],prow[3],fv);
  vec3 col = cr3(crow[0],crow[1],crow[2],crow[3],fv);

  // Pure bicubic evaluation — motion comes from the engine animating the
  // 16 control points themselves (uCtrlPos), so the surface genuinely flexes.
  gl_Position = vec4(pos.x*2.0-1.0, 1.0-pos.y*2.0, 0.0, 1.0);
  vColor = col;
}
`;

const FRAG_MESH = `
precision highp float;
varying vec3 vColor;
uniform float uGrain;
uniform float uTime;

vec3 lin2srgb(vec3 c){
  vec3 lo = c*12.92;
  vec3 hi = 1.055*pow(clamp(c,vec3(0.0),vec3(1.0)),vec3(1.0/2.4))-0.055;
  return mix(lo, hi, step(vec3(0.0031308), c));
}

void main(){
  vec3 c = lin2srgb(clamp(vColor,0.0,1.0));
  float g = fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898,78.233)))*43758.5453)-0.5;
  c += g*uGrain;
  gl_FragColor = vec4(clamp(c,0.0,1.0),1.0);
}
`;

// Color helpers + a hue-preserving dark-mode derivation (OKLab).
// deriveDark() reduces perceptual lightness while keeping hue, so a dark
// variant reads as the same color family rather than a muddy sRGB multiply.

function hexToRgb01(hex) {
  let h = (hex || '#000000').replace('#', '');
  if (h.length === 3) h = h.split('').map((x) => x + x).join('');
  const n = parseInt(h, 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function rgb01ToHex(r, g, b) {
  const c = (v) => Math.max(0, Math.min(255, Math.round(v * 255))).toString(16).padStart(2, '0');
  return '#' + c(r) + c(g) + c(b);
}

function srgbToLinear(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function linearToSrgb(c) { return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }

function linearToOklab(r, g, b) {
  const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
  const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
  const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
  const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
  return [
    0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
    1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
    0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_,
  ];
}

function oklabToLinear(L, a, b) {
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  return [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s,
  ];
}

// Derive a dark-mode variant of a color: keep hue (OKLab a/b direction),
// lower perceptual lightness, and ease chroma back slightly so it doesn't glow.
function deriveDark(hex, { lightness = 0.5, chroma = 0.92 } = {}) {
  const [r, g, b] = hexToRgb01(hex);
  const [L, a, bb] = linearToOklab(srgbToLinear(r), srgbToLinear(g), srgbToLinear(b));
  const lin = oklabToLinear(L * lightness, a * chroma, bb * chroma);
  return rgb01ToHex(
    linearToSrgb(Math.max(0, lin[0])),
    linearToSrgb(Math.max(0, lin[1])),
    linearToSrgb(Math.max(0, lin[2])),
  );
}

// The mesh gradient runtime. This is the SINGLE SOURCE OF TRUTH: the editor runs
// this exact code, and "Export Code" ships this file verbatim. No dependencies.
//
//   const gradient = initMeshGradient(canvas, config, options);
//   gradient.play(); gradient.pause(); gradient.setConfig({ ... });
//

const MAX_POINTS = 16;
const MESH_TESS = 128; // matches Figma's default tessellation quality

const DEFAULT_CONFIG = {
  // 'points' = free inverse-distance points; 'mesh' = 4x4 Catmull-Rom bicubic
  // grid (Figma-compatible). In mesh mode, points[] holds exactly 16 entries in
  // row-major grid order (p00,p10,p20,p30, p01,...), spread is ignored.
  mode: 'points',
  points: [
    { x: 0.15, y: 0.20, color: '#5b3cc4' }, // indigo
    { x: 0.85, y: 0.15, color: '#9d4edd' }, // violet
    { x: 0.20, y: 0.80, color: '#ff5d8f' }, // pink
    { x: 0.60, y: 0.95, color: '#ff8a5b' }, // coral
    { x: 0.90, y: 0.75, color: '#ffd166' }, // gold
  ],
  animation: { play: true, speed: 0.85, noiseScale: 1.3, noiseSpeed: 0.12, warp: 0.7 },
  effects:   { falloff: 1.1, grain: 0.045, vignette: 0.18 },
  // Editor/export metadata only — the runtime ignores this and sizes to its
  // container. It sets the design aspect ratio and the PNG export resolution.
  frame:     { width: 1920, height: 1080 },
};

// ---- small helpers -----------------------------------------------------------
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function mergeConfig(base, over) {
  const c = clone(base);
  if (!over) return c;
  if (over.mode) c.mode = over.mode;
  if (over.points) c.points = clone(over.points);
  if (over.animation) Object.assign(c.animation, over.animation);
  if (over.effects) Object.assign(c.effects, over.effects);
  if (over.frame) Object.assign(c.frame, over.frame);
  return c;
}

function hexToRgb(hex) {
  let h = (hex || '#000000').replace('#', '');
  if (h.length === 3) h = h.split('').map((x) => x + x).join('');
  const n = parseInt(h, 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function srgb2lin(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }

function compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error('Shader compile error: ' + log);
  }
  return s;
}

// ---- the engine --------------------------------------------------------------
function initMeshGradient(canvas, userConfig = {}, options = {}) {
  const opts = Object.assign({
    maxDpr: 2,
    respectReducedMotion: true,
    pauseWhenHidden: true,
    autoStart: true,
  }, options);

  const gl = canvas.getContext('webgl', {
    antialias: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: true, // needed for reliable PNG capture
  });
  if (!gl) throw new Error('WebGL is not supported in this browser.');

  let config = mergeConfig(DEFAULT_CONFIG, userConfig);

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FRAG(MAX_POINTS)));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error('Program link error: ' + gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  // full-screen quad
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPosition = gl.getAttribLocation(prog, 'aPosition');
  gl.enableVertexAttribArray(aPosition);
  gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  const ARRAY_UNIFORMS = { uPoints: 1, uColors: 1, uSpread: 1 };
  ['uTime', 'uResolution', 'uAspect', 'uCount', 'uPoints', 'uColors', 'uSpread',
   'uWarp', 'uNoiseScale', 'uFalloff', 'uGrain', 'uVignette']
    .forEach((n) => { U[n] = gl.getUniformLocation(prog, ARRAY_UNIFORMS[n] ? n + '[0]' : n); });

  const posBuf = new Float32Array(MAX_POINTS * 2);
  const colBuf = new Float32Array(MAX_POINTS * 3);
  const spreadBuf = new Float32Array(MAX_POINTS).fill(1);

  // ---- bicubic mesh mode: second program + tessellated (s,t) grid ------------
  const meshProg = gl.createProgram();
  gl.attachShader(meshProg, compile(gl, gl.VERTEX_SHADER, VERT_MESH));
  gl.attachShader(meshProg, compile(gl, gl.FRAGMENT_SHADER, FRAG_MESH));
  gl.linkProgram(meshProg);
  if (!gl.getProgramParameter(meshProg, gl.LINK_STATUS)) {
    throw new Error('Mesh program link error: ' + gl.getProgramInfoLog(meshProg));
  }
  const MU = {};
  ['uCtrlPos', 'uCtrlColor', 'uTime', 'uGrain'].forEach((n) => {
    MU[n] = gl.getUniformLocation(meshProg, (n === 'uCtrlPos' || n === 'uCtrlColor') ? n + '[0]' : n);
  });
  const aST = gl.getAttribLocation(meshProg, 'aST');

  // (s,t) grid: (T+1)^2 vertices, T*T*2 triangles, Uint16 indices (WebGL1-safe)
  const T = MESH_TESS, NV = T + 1;
  const stData = new Float32Array(NV * NV * 2);
  for (let j = 0, o = 0; j < NV; j++) for (let i = 0; i < NV; i++) {
    stData[o++] = i / T; stData[o++] = j / T;
  }
  const idxData = new Uint16Array(T * T * 6);
  for (let j = 0, o = 0; j < T; j++) for (let i = 0; i < T; i++) {
    const i0 = j * NV + i, i1 = i0 + 1, i2 = i0 + NV, i3 = i2 + 1;
    idxData[o++] = i0; idxData[o++] = i2; idxData[o++] = i1;
    idxData[o++] = i1; idxData[o++] = i2; idxData[o++] = i3;
  }
  const stBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, stBuf);
  gl.bufferData(gl.ARRAY_BUFFER, stData, gl.STATIC_DRAW);
  const idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idxData, gl.STATIC_DRAW);

  const ctrlPosBuf = new Float32Array(16 * 2);
  const ctrlColBuf = new Float32Array(16 * 3);

  let time = 0;
  let lastT = 0;
  let raf = null;
  let playing = false;
  const reduce = opts.respectReducedMotion &&
    typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Size the backing store. With no args, tracks the container responsively
  // (this is what the exported runtime always does). With forced w/h it renders
  // at an exact resolution — used only for capture/export.
  function resize(forceW, forceH) {
    let w, h;
    if (forceW) {
      w = Math.max(1, Math.round(forceW));
      h = Math.max(1, Math.round(forceH));
    } else {
      const dpr = Math.min(window.devicePixelRatio || 1, opts.maxDpr);
      w = Math.max(1, Math.round((canvas.clientWidth || canvas.width) * dpr));
      h = Math.max(1, Math.round((canvas.clientHeight || canvas.height) * dpr));
    }
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function render() {
    if (config.mode === 'mesh' && config.points.length === 16) renderMesh();
    else renderPoints();
  }

  // Deterministic per-point phase hash (no Math.random — keeps renders stable).
  function hash01(n) { const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); }

  function renderMesh() {
    const a = config.animation, e = config.effects;
    // The mesh animates by drifting the 16 control points themselves, so the
    // bicubic surface genuinely flexes. Each point gets a two-band oscillator
    // with hashed phases/frequencies. Border points may only slide ALONG their
    // edge and corners stay pinned — the boundary curve of the surface depends
    // solely on its border points, so frame edges stay exactly straight.
    const t = time * a.noiseSpeed * 10.0;
    const amp = a.warp * 0.14;
    const fs = a.noiseScale;
    let mr = 0, mg = 0, mb = 0;
    for (let i = 0; i < 16; i++) {
      const p = config.points[i];
      let dx = 0, dy = 0;
      if (amp > 0) {
        const f1 = fs * (0.8 + 0.5 * hash01(i * 12.99 + 1));
        const f3 = fs * (0.9 + 0.5 * hash01(i * 12.99 + 3));
        const P = 6.2832;
        // constant-velocity orbit (alternating direction) + a slower breathing
        // oscillation. The orbit's uniform angular motion makes the animation
        // tempo — and thus the Speed control — clearly readable.
        const dir = (i % 2 === 0) ? 1 : -1;
        const orb = dir * t * fs * (0.9 + 0.7 * hash01(i * 3.7 + 5)) + P * hash01(i * 3.7 + 6);
        dx = amp * (0.5 * Math.sin(t * f1 + P * hash01(i * 78.23 + 1)) + 0.5 * Math.cos(orb));
        dy = amp * (0.5 * Math.sin(t * f3 + P * hash01(i * 78.23 + 3)) + 0.5 * Math.sin(orb));
        // pin motion perpendicular to any frame edge the point sits on
        if (Math.abs(p.x) < 0.02 || Math.abs(p.x - 1) < 0.02) dx = 0;
        if (Math.abs(p.y) < 0.02 || Math.abs(p.y - 1) < 0.02) dy = 0;
      }
      ctrlPosBuf[i * 2] = p.x + dx;
      ctrlPosBuf[i * 2 + 1] = p.y + dy; // mesh vertex shader is y-down, like the UI
      const rgb = hexToRgb(p.color);
      ctrlColBuf[i * 3] = srgb2lin(rgb[0]);
      ctrlColBuf[i * 3 + 1] = srgb2lin(rgb[1]);
      ctrlColBuf[i * 3 + 2] = srgb2lin(rgb[2]);
      mr += rgb[0]; mg += rgb[1]; mb += rgb[2];
    }
    gl.useProgram(meshProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, stBuf);
    gl.enableVertexAttribArray(aST);
    gl.vertexAttribPointer(aST, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
    gl.uniform2fv(MU.uCtrlPos, ctrlPosBuf);
    gl.uniform3fv(MU.uCtrlColor, ctrlColBuf);
    gl.uniform1f(MU.uTime, time * a.noiseSpeed);
    gl.uniform1f(MU.uGrain, e.grain);
    // clear to the mean control color so any warp-exposed sliver isn't black
    gl.clearColor(mr / 16, mg / 16, mb / 16, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawElements(gl.TRIANGLES, T * T * 6, gl.UNSIGNED_SHORT, 0);
  }

  function renderPoints() {
    const pts = config.points.slice(0, MAX_POINTS);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);
    for (let i = 0; i < pts.length; i++) {
      posBuf[i * 2] = pts[i].x;
      posBuf[i * 2 + 1] = 1.0 - pts[i].y; // flip: UI y-down -> GL y-up
      const rgb = hexToRgb(pts[i].color);
      colBuf[i * 3] = rgb[0];
      colBuf[i * 3 + 1] = rgb[1];
      colBuf[i * 3 + 2] = rgb[2];
      spreadBuf[i] = pts[i].spread != null ? pts[i].spread : 1.0;
    }
    const a = config.animation, e = config.effects;
    gl.uniform1f(U.uTime, time * a.noiseSpeed);
    gl.uniform2f(U.uResolution, canvas.width, canvas.height);
    gl.uniform1f(U.uAspect, canvas.width / Math.max(1, canvas.height));
    gl.uniform1i(U.uCount, pts.length);
    gl.uniform2fv(U.uPoints, posBuf);
    gl.uniform3fv(U.uColors, colBuf);
    gl.uniform1fv(U.uSpread, spreadBuf);
    gl.uniform1f(U.uWarp, a.warp);
    gl.uniform1f(U.uNoiseScale, a.noiseScale);
    gl.uniform1f(U.uFalloff, e.falloff);
    gl.uniform1f(U.uGrain, e.grain);
    gl.uniform1f(U.uVignette, e.vignette);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function draw() { resize(); render(); }

  function frame(now) {
    if (!playing) return;
    const dt = lastT ? (now - lastT) / 1000 : 0;
    lastT = now;
    time += dt * config.animation.speed;
    draw();
    raf = requestAnimationFrame(frame);
  }

  function play() {
    if (playing) return;
    if (reduce) { draw(); return; } // honor reduced-motion: render a still frame
    playing = true;
    lastT = 0;
    raf = requestAnimationFrame(frame);
  }

  function pause() {
    playing = false;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    draw();
  }

  // pause when the tab is hidden so we never burn GPU in the background
  let resumeOnShow = false;
  function onVisibility() {
    if (!opts.pauseWhenHidden) return;
    if (document.hidden) { resumeOnShow = playing; pause(); }
    else if (resumeOnShow) { play(); }
  }
  document.addEventListener('visibilitychange', onVisibility);

  // pause when scrolled off-screen
  let io = null;
  if (opts.pauseWhenHidden && typeof IntersectionObserver === 'function') {
    io = new IntersectionObserver((entries) => {
      const visible = entries[0].isIntersecting;
      if (!visible && playing) { resumeOnShow = true; pause(); }
      else if (visible && resumeOnShow) { resumeOnShow = false; play(); }
    }, { threshold: 0 });
    io.observe(canvas);
  }

  let ro = null;
  if (typeof ResizeObserver === 'function') {
    ro = new ResizeObserver(() => { if (!playing) draw(); });
    ro.observe(canvas);
  }

  const controller = {
    canvas, gl,
    play, pause,
    toggle() { playing ? pause() : play(); return playing; },
    isPlaying() { return playing; },
    redraw: draw,
    reset() { time = 0; draw(); },
    seek(t) { time = t; draw(); },
    getTime() { return time; },
    getConfig() { return clone(config); },
    setConfig(partial) {
      config = mergeConfig(config, partial);
      // sync animation.play intent
      if (partial.animation && typeof partial.animation.play === 'boolean') {
        partial.animation.play ? play() : pause();
      } else if (!playing) {
        draw();
      }
    },
    // Freeze the current frame, render it at an exact resolution (defaults to
    // the config frame size), read it back, then restore the responsive canvas.
    // Stays paused on the captured frame. Returns a Promise<Blob>.
    capture(width, height, type = 'image/png', quality) {
      const w = width || config.frame.width;
      const h = height || config.frame.height;
      pause();
      resize(w, h);
      render();
      return new Promise((resolve) => {
        canvas.toBlob((blob) => {
          resize(); render(); // back to on-screen responsive size
          resolve(blob);
        }, type, quality);
      });
    },
    captureDataURL(width, height, type = 'image/png', quality) {
      const w = width || config.frame.width;
      const h = height || config.frame.height;
      pause();
      resize(w, h);
      render();
      const url = canvas.toDataURL(type, quality);
      resize(); render();
      return url;
    },
    destroy() {
      pause();
      document.removeEventListener('visibilitychange', onVisibility);
      if (io) io.disconnect();
      if (ro) ro.disconnect();
      gl.deleteProgram(prog);
      gl.deleteBuffer(buf);
      gl.deleteProgram(meshProg);
      gl.deleteBuffer(stBuf);
      gl.deleteBuffer(idxBuf);
    },
  };

  draw();
  if (opts.autoStart && config.animation.play) play();
  return controller;
}

// Convert a Figma "Mesh gradient" SHADER fill's parameters into a tool config.
// Figma exposes a shader fill as { type:'SHADER', id, properties } where each
// color-point property is { x, y (in %), color:{r,g,b,a} } and numeric props
// (e.g. tessellation) are plain numbers. We map the color-points into our
// free-point engine (inverse-distance). This is the "quick" import — a faithful
// 4x4 Catmull-Rom bicubic mode is a planned follow-up.

// Figma's "Mesh gradient" shader fill (account-library build). The property
// keys are stable hashes of the parameter names p00..p33 / tessellation,
// derived by reading a pristine default-lattice fill and cross-checked against
// the shader source's defaults. Row-major grid order matches config.points in
// mesh mode, so index i maps to MESH_SHADER_SLOT_KEYS[i].
const MESH_SHADER_ID = '3f03519cd6fb9dd0902b984c6179893f45bedc85/428';
const MESH_SHADER_SLOT_KEYS = [
  '3320634909:3476955528', '4114930664:3251078132', '2659398696:3309137918', '2641195073:3606991302', // p00 p10 p20 p30
  '2510368863:1749092474', '4186663962:2165964532', '2593232746:3394489926', '4257263820:4091994006', // p01 p11 p21 p31
  '2275808186:3094044812', '3553020740:1790315864', '3587754145:3674750112', '3996248449:2683851748', // p02 p12 p22 p32
  '2704260425:2064916084', '4108435739:969888618', '3390006660:875800174', '3230229320:3152342904',   // p03 p13 p23 p33
];
const MESH_SHADER_TESS_KEY = '2849611793:731443280';

// Build a complete SHADER paint from a mesh-mode config — ready to assign into
// a Figma node's fills via the Plugin API (writes to existing shader fills are
// confirmed; adding to a node with no shader fill is the path this exposes).
function configToFigmaShaderPaint(config, { tessellation = 128 } = {}) {
  if (config.mode !== 'mesh' || config.points.length !== 16) {
    throw new Error('Figma shader export requires mesh mode with 16 grid points.');
  }
  const properties = {};
  config.points.forEach((p, i) => {
    const [r, g, b] = hexToRgb01(p.color);
    properties[MESH_SHADER_SLOT_KEYS[i]] = { x: p.x * 100, y: p.y * 100, color: { r, g, b, a: 1 } };
  });
  properties[MESH_SHADER_TESS_KEY] = tessellation;
  return { type: 'SHADER', visible: true, opacity: 1, blendMode: 'NORMAL', id: MESH_SHADER_ID, properties };
}

// Recover the 4x4 grid topology from unlabeled points: Figma hashes the
// p00..p33 property names, so we re-derive each point's lattice slot. Meshes
// are edited by dragging the default grid, so a greedy nearest-slot assignment
// (all point/slot pairs sorted by distance to the default lattice positions,
// closest pairs claimed first) recovers the topology for typical meshes.
// Extremely tangled meshes are inherently ambiguous without the labels.
function recoverGridOrder(points) {
  const slotPos = (i) => (i === 3 ? 1.0 : i / 3); // default lattice: 0, 1/3, 2/3, 1
  const pairs = [];
  for (let s = 0; s < 16; s++) {
    const sx = slotPos(s % 4), sy = slotPos(Math.floor(s / 4));
    for (let p = 0; p < 16; p++) {
      const dx = points[p].x - sx, dy = points[p].y - sy;
      pairs.push({ s, p, d: dx * dx + dy * dy });
    }
  }
  pairs.sort((a, b) => a.d - b.d);
  const grid = new Array(16);
  const usedSlot = new Array(16).fill(false);
  const usedPt = new Array(16).fill(false);
  for (const { s, p } of pairs) {
    if (usedSlot[s] || usedPt[p]) continue;
    grid[s] = points[p];
    usedSlot[s] = true;
    usedPt[p] = true;
  }
  return grid;
}

// A self-contained Plugin API snippet that applies the current mesh design to
// whatever node is selected in Figma. Paste into the Figma desktop console
// (Plugins → Development → Open Console) — no plugin install required.
function buildFigmaApplyScript(config) {
  const paint = configToFigmaShaderPaint(config);
  return `// Mesh gradient — select target frame(s) in Figma, then run this
// in Plugins → Development → Open Console (Figma desktop app).
(() => {
  const paint = ${JSON.stringify(paint, null, 2)};
  const sel = figma.currentPage.selection.filter((n) => 'fills' in n);
  if (!sel.length) { figma.notify('Select a frame or shape first'); return; }
  sel.forEach((n) => { n.fills = [paint]; });
  figma.notify('Mesh gradient applied to ' + sel.length + ' layer(s)');
})();
`;
}

// The read-side counterpart of the apply script: run in the Figma desktop
// console with a meshed layer selected, it copies the shader fill's data as
// JSON (devtools' copy() builtin) for pasting into the tool's import box.
function buildFigmaReadScript() {
  return `// Mesh gradient import — select the layer with the mesh shader fill,
// then run this in Plugins → Development → Open Console (Figma desktop).
(() => {
  const n = figma.currentPage.selection[0];
  const f = n && 'fills' in n && Array.from(n.fills).find((x) => x.type === 'SHADER');
  if (!f) { figma.notify('Select a layer with a mesh gradient fill first'); return; }
  const json = JSON.stringify({ width: n.width, height: n.height, properties: f.properties });
  try { copy(json); figma.notify('Mesh copied — paste it into the gradient tool'); }
  catch (e) { console.log(json); figma.notify('copy() unavailable — copy the JSON logged below'); }
})();
`;
}

// Accept the JSON shapes a user might paste: the read-script output
// ({width,height,properties}), a full SHADER paint ({type,properties}), or a
// bare properties map. Returns { properties, width, height }.
function parseFigmaMeshJSON(text) {
  const obj = JSON.parse(text);
  const properties = obj.properties || obj;
  const pointCount = Object.values(properties)
    .filter((v) => v && typeof v === 'object' && typeof v.x === 'number' && v.color).length;
  if (pointCount < 2) throw new Error('No mesh color points found — paste the JSON copied by the Figma read script.');
  return { properties, width: obj.width, height: obj.height };
}

// Refine a recovered grid against a reference render of the actual Figma node.
// The analytic recovery can mis-slot heavily dragged points (the hashed keys
// destroy the labels, and distance heuristics can't see the truth). Rendering
// candidate assignments and scoring them against the reference can: hill-climb
// pairwise slot swaps, keeping any swap that reduces the pixel delta.
// referenceURL: same-origin or data: URL of the Figma node render.
async function refineGridOrderByReference(gridPoints, referenceURL) {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = referenceURL; });
  // small working resolution: plenty for scoring, fast to render/read
  const W = 160, H = Math.max(8, Math.round(160 * img.naturalHeight / img.naturalWidth));
  const rc = document.createElement('canvas');
  rc.width = W; rc.height = H;
  rc.getContext('2d').drawImage(img, 0, 0, W, H);
  const rd = rc.getContext('2d').getImageData(0, 0, W, H).data;

  const cv = document.createElement('canvas');
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.style.position = 'fixed'; cv.style.left = '-9999px';
  document.body.appendChild(cv);
  const engine = initMeshGradient(cv, {
    mode: 'mesh', points: gridPoints,
    animation: { play: false, speed: 0, noiseScale: 1, noiseSpeed: 0, warp: 0 },
    effects: { falloff: 1, grain: 0, vignette: 0 },
  }, { autoStart: false, pauseWhenHidden: false, maxDpr: 1 });

  const gl = engine.gl;
  const px = new Uint8Array(W * H * 4);
  const SX = 24, SY = 10; // dense sample lattice — sparse grids alias topologies
  function score(points) {
    engine.setConfig({ points });
    engine.redraw();
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let sum = 0;
    for (let gy = 0; gy < SY; gy++) for (let gx = 0; gx < SX; gx++) {
      const x = Math.floor((gx + 0.5) / SX * W), y = Math.floor((gy + 0.5) / SY * H);
      const ri = (y * W + x) * 4;
      const oi = ((H - 1 - y) * W + x) * 4; // readPixels rows are bottom-up
      sum += Math.abs(rd[ri] - px[oi]) + Math.abs(rd[ri + 1] - px[oi + 1]) + Math.abs(rd[ri + 2] - px[oi + 2]);
    }
    return sum;
  }

  // Best-improvement hill-climb: evaluate every pairwise slot swap, apply only
  // the single best one, repeat. (First-improvement wanders into score-neutral
  // local optima when many control points share a color.)
  let order = gridPoints.slice();
  let best = score(order);
  for (let round = 0; round < 16 && best > 0; round++) {
    let bestSwap = null, bestScore = best;
    for (let i = 0; i < 15; i++) for (let j = i + 1; j < 16; j++) {
      const trial = order.slice();
      [trial[i], trial[j]] = [trial[j], trial[i]];
      const s = score(trial);
      if (s < bestScore) { bestScore = s; bestSwap = [i, j]; }
    }
    if (!bestSwap) break;
    [order[bestSwap[0]], order[bestSwap[1]]] = [order[bestSwap[1]], order[bestSwap[0]]];
    best = bestScore;
  }
  engine.destroy();
  cv.remove();
  return { points: order, residual: best };
}

function figmaShaderToConfig(properties, opts = {}) {
  const width = opts.width || 1440;
  const height = opts.height || 580;

  const points = [];
  for (const key in properties) {
    const v = properties[key];
    if (v && typeof v === 'object' && typeof v.x === 'number' && typeof v.y === 'number' && v.color) {
      points.push({
        x: v.x / 100,
        y: v.y / 100,
        color: rgb01ToHex(v.color.r, v.color.g, v.color.b),
      });
    }
  }

  // Faithful path: exactly 16 points -> Figma-compatible bicubic mesh mode,
  // with grid order recovered. Otherwise fall back to free-point approximation.
  const isMesh = points.length === 16 && opts.mode !== 'points';
  const ordered = isMesh
    ? recoverGridOrder(points)
    : points.slice(0, 16).map((p) => ({ ...p, spread: 1 }));

  return {
    mode: isMesh ? 'mesh' : 'points',
    points: ordered,
    // Arrive animated: gentle but clearly alive; sliders dial it from there.
    animation: { play: true, speed: 0.6, noiseScale: 1.2, noiseSpeed: 0.08, warp: 0.5 },
    effects: { falloff: 1.0, grain: 0, vignette: 0 },
    frame: { width, height },
  };
}

// ---- config import / export --------------------------------------------------
function configToJSON(config) {
  return JSON.stringify(config, null, 2);
}

function parseConfigJSON(text) {
  const c = JSON.parse(text);
  if (!c || !Array.isArray(c.points)) throw new Error('Invalid config: missing points[].');
  return c;
}

// ---- standalone code export --------------------------------------------------
// We fetch the LIVE engine source so the exported snippet always matches what
// the editor runs — one source of truth, no drift.
async function fetchSource(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Could not read ' + url);
  return res.text();
}

function stripModuleSyntax(src) {
  return src
    .replace(/^\s*import[^\n]*\n/gm, '')      // drop import lines
    .replace(/^(\s*)export\s+(?=(async|const|function|class|let|var)\b)/gm, '$1') // drop export keyword
    .replace(/^\s*export\s+\{[^}]*\};?\s*$/gm, ''); // drop bare export { ... }
}

// Build a single self-contained IIFE: shader + engine + config + bootstrap.
async function buildStandaloneJS(config, base = './') {
  const [shaderSrc, meshShaderSrc, engineSrc] = await Promise.all([
    fetchSource(base + 'src/shader.glsl.js'),
    fetchSource(base + 'src/shader-mesh.js'),
    fetchSource(base + 'src/gradient.js'),
  ]);

  const body = stripModuleSyntax(shaderSrc) + '\n' + stripModuleSyntax(meshShaderSrc) + '\n' + stripModuleSyntax(engineSrc);
  const cfg = JSON.stringify(config, null, 2);

  return `/* Animated mesh gradient — self-contained, no dependencies.
   Usage:  <canvas id="gradient" style="width:100%;height:100vh"></canvas>
           <script src="mesh-gradient.js"><\/script>
   Or pass your own canvas + config to initMeshGradient(canvas, config). */
(function (root) {
${body}

  var CONFIG = ${cfg};

  function boot() {
    var canvas = document.getElementById('gradient');
    if (!canvas) return;
    root.meshGradient = initMeshGradient(canvas, CONFIG);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }

  root.initMeshGradient = initMeshGradient;
})(typeof window !== 'undefined' ? window : this);
`;
}

// A ready-to-open HTML demo wrapping the standalone JS.
async function buildStandaloneHTML(config, base = './') {
  // Escape <\/script> sequences (e.g. in the usage comment) — the HTML parser
  // would otherwise terminate the inline script block at the first one.
  const js = (await buildStandaloneJS(config, base)).replace(/<\/script/gi, '<\\/script');
  return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesh Gradient</title>
<style>html,body{margin:0;height:100%}#gradient{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="gradient"></canvas>
<script>
${js}
<\/script>
</body>
</html>
`;
}

// A CSS-only approximation for no-WebGL / prefers-reduced-motion fallbacks.
// Uses layered radial-gradients at each point's position/color.
function buildCSSFallback(config) {
  const layers = config.points.map((p) => {
    const x = (p.x * 100).toFixed(1);
    const y = (p.y * 100).toFixed(1);
    return `radial-gradient(circle at ${x}% ${y}%, ${p.color} 0%, transparent 55%)`;
  });
  const base = config.points[0] ? config.points[0].color : '#222';
  return `.mesh-gradient {
  background-color: ${base};
  background-image:
    ${layers.join(',\n    ')};
}`;
}

const ENGINE_SRC = "// Shader source for the animated mesh gradient.\n// Kept dependency-free and WebGL1 (GLSL ES 1.00) for maximum portability.\n\nconst VERT = `\nattribute vec2 aPosition;\nvarying vec2 vUv;\nvoid main() {\n  vUv = aPosition * 0.5 + 0.5;\n  gl_Position = vec4(aPosition, 0.0, 1.0);\n}\n`;\n\n// FRAG is a function of MAX_POINTS so the same source powers both the editor\n// and the exported standalone runtime (which inlines this file verbatim).\nconst FRAG = (maxPoints) => `\nprecision highp float;\n#define MAX_POINTS ${maxPoints}\n\nvarying vec2 vUv;\n\nuniform float uTime;\nuniform vec2  uResolution;\nuniform float uAspect;\nuniform int   uCount;\nuniform vec2  uPoints[MAX_POINTS];\nuniform vec3  uColors[MAX_POINTS];\nuniform float uSpread[MAX_POINTS]; // per-point radius of influence\n\nuniform float uWarp;        // domain-warp amount\nuniform float uNoiseScale;  // spatial frequency of the flow\nuniform float uFalloff;     // blend falloff (higher = sharper points)\nuniform float uGrain;       // film grain amount\nuniform float uVignette;    // corner darkening\n\n// --- 2D simplex noise (Ashima / Stefan Gustavson, public domain) ---\nvec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }\nvec2 mod289(vec2 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }\nvec3 permute(vec3 x){ return mod289(((x * 34.0) + 1.0) * x); }\nfloat snoise(vec2 v){\n  const vec4 C = vec4(0.211324865405187, 0.366025403784439,\n                     -0.577350269189626, 0.024390243902439);\n  vec2 i  = floor(v + dot(v, C.yy));\n  vec2 x0 = v - i + dot(i, C.xx);\n  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);\n  vec4 x12 = x0.xyxy + C.xxzz;\n  x12.xy -= i1;\n  i = mod289(i);\n  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));\n  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);\n  m = m * m; m = m * m;\n  vec3 x = 2.0 * fract(p * C.www) - 1.0;\n  vec3 h = abs(x) - 0.5;\n  vec3 ox = floor(x + 0.5);\n  vec3 a0 = x - ox;\n  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);\n  vec3 g;\n  g.x  = a0.x * x0.x + h.x * x0.y;\n  g.yz = a0.yz * x12.xz + h.yz * x12.yw;\n  return 130.0 * dot(m, g);\n}\n\nvoid main() {\n  vec2 uv = vUv;\n  vec2 aspect = vec2(uAspect, 1.0);\n\n  // --- domain warp: noise offsets the sample point over time -> organic flow\n  float t = uTime;\n  vec2 warp = vec2(\n    snoise(uv * uNoiseScale + vec2(0.0, t)),\n    snoise(uv * uNoiseScale + vec2(5.2, t + 1.3))\n  );\n  vec2 p = uv + warp * (uWarp * 0.18);\n\n  // --- weighted blend of all color points (inverse-distance mesh)\n  vec3 color = vec3(0.0);\n  float total = 0.0;\n  for (int i = 0; i < MAX_POINTS; i++) {\n    if (i >= uCount) break;\n    vec2 d = (p - uPoints[i]) * aspect;\n    float s = max(uSpread[i], 0.05);\n    float dist2 = dot(d, d) / (s * s) + 0.0008; // larger spread -> wider reach\n    float w = 1.0 / pow(dist2, uFalloff);\n    color += uColors[i] * w; // blend in sRGB/gamma space to match Figma & CSS\n    total += w;\n  }\n  color = color / max(total, 0.0001);\n\n  // --- vignette\n  float vig = smoothstep(1.1, 0.35, distance(uv, vec2(0.5)));\n  color = mix(color, color * vig, uVignette);\n\n  // --- film grain\n  float g = fract(sin(dot(uv * uResolution + uTime, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;\n  color += g * uGrain;\n\n  gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);\n}\n`;\n\n// Faithful bicubic mesh mode \u2014 a port of Figma's \"Mesh gradient\" shader (WGSL)\n// to WebGL1 GLSL ES 1.00. Forward tessellation: a triangle grid in (s,t) space\n// is warped by a 4x4 Catmull-Rom bicubic control net in the VERTEX shader, and\n// colors are Gouraud-interpolated in linear light (like Figma), then converted\n// back to sRGB in the fragment shader. Optional time-based warp adds motion.\n//\n// Control points are supplied as 16 entries in row-major grid order:\n//   index = row*4 + col   (p_{col,row}: col=x, row=y), matching Figma's layout.\n\nconst VERT_MESH = `\nattribute vec2 aST;\n\nuniform vec2  uCtrlPos[16];   // grid positions, x/y in 0..1 (y down)\nuniform vec3  uCtrlColor[16]; // grid colors, LINEAR light\n\nvarying vec3 vColor;\n\n// --- Catmull-Rom basis ---\nfloat cr1(float a,float b,float c,float d,float t){\n  return 0.5*((2.0*b)+(-a+c)*t+(2.0*a-5.0*b+4.0*c-d)*t*t+(-a+3.0*b-3.0*c+d)*t*t*t);\n}\nvec2 cr2(vec2 a,vec2 b,vec2 c,vec2 d,float t){ return vec2(cr1(a.x,b.x,c.x,d.x,t),cr1(a.y,b.y,c.y,d.y,t)); }\nvec3 cr3(vec3 a,vec3 b,vec3 c,vec3 d,float t){ return vec3(cr1(a.x,b.x,c.x,d.x,t),cr1(a.y,b.y,c.y,d.y,t),cr1(a.z,b.z,c.z,d.z,t)); }\n\n// ES 1.00-safe dynamic fetch (loop counter indexing is allowed; k is dynamic).\nvec2 getP(int k){ for(int n=0;n<16;n++){ if(n==k) return uCtrlPos[n]; } return uCtrlPos[15]; }\nvec3 getC(int k){ for(int n=0;n<16;n++){ if(n==k) return uCtrlColor[n]; } return uCtrlColor[15]; }\nint idx(int i,int j){ int ci=(i<0)?0:((i>3)?3:i); int cj=(j<0)?0:((j>3)?3:j); return cj*4+ci; }\n\nvoid main(){\n  float uu = aST.x*3.0; float vv = aST.y*3.0;\n  int i = int(floor(uu)); i = (i<0)?0:((i>2)?2:i);\n  int j = int(floor(vv)); j = (j<0)?0:((j>2)?2:j);\n  float fu = uu-float(i); float fv = vv-float(j);\n\n  vec2 prow[4]; vec3 crow[4];\n  for(int m=0;m<4;m++){\n    int jj = j-1+m;\n    prow[m] = cr2(getP(idx(i-1,jj)), getP(idx(i,jj)), getP(idx(i+1,jj)), getP(idx(i+2,jj)), fu);\n    crow[m] = cr3(getC(idx(i-1,jj)), getC(idx(i,jj)), getC(idx(i+1,jj)), getC(idx(i+2,jj)), fu);\n  }\n  vec2 pos = cr2(prow[0],prow[1],prow[2],prow[3],fv);\n  vec3 col = cr3(crow[0],crow[1],crow[2],crow[3],fv);\n\n  // Pure bicubic evaluation \u2014 motion comes from the engine animating the\n  // 16 control points themselves (uCtrlPos), so the surface genuinely flexes.\n  gl_Position = vec4(pos.x*2.0-1.0, 1.0-pos.y*2.0, 0.0, 1.0);\n  vColor = col;\n}\n`;\n\nconst FRAG_MESH = `\nprecision highp float;\nvarying vec3 vColor;\nuniform float uGrain;\nuniform float uTime;\n\nvec3 lin2srgb(vec3 c){\n // Plugin panel editor. Runs against the SAME engine code as the web tool —
// the build script (build_plugin.py) bundles src/*.js above this file, plus an
// ENGINE_SRC string used for the code exports. Outside Figma (opened directly
// in a browser for testing) Figma-side actions are stubbed.

const PANEL_VERSION = 14; // bump on each build_plugin.py rebuild worth telling apart
const IN_FIGMA = window.parent !== window;
const $ = (id) => document.getElementById(id);
const post = (msg) => { if (IN_FIGMA) parent.postMessage({ pluginMessage: msg }, '*'); };

const statusEl = $('status');
function setStatus(text, isError) {
  statusEl.textContent = text || '';
  statusEl.className = isError ? 'err' : '';
}

// ---- state ------------------------------------------------------------------
let config = JSON.parse(JSON.stringify(PRESETS['Figma Lattice']));
config.frame = { width: 1440, height: 580 };
let mode = 'light';
let selected = 0;
let userPresets = {}; // name -> config, persisted via clientStorage

const resolveDark = (p) => p.darkColor || deriveDark(p.color);
const pointColor = (p) => (mode === 'dark' ? resolveDark(p) : p.color);

const canvas = $('cv');
const engine = initMeshGradient(canvas, config, { pauseWhenHidden: false });

function pushCfg() {
  engine.setConfig({
    mode: config.mode || 'points',
    points: config.points.map((p) => ({ x: p.x, y: p.y, spread: p.spread, color: pointColor(p) })),
    animation: config.animation,
    effects: config.effects,
  });
}

// ---- playback / mode --------------------------------------------------------
function syncPlayUI() {
  const playing = engine.isPlaying();
  $('play').textContent = playing ? '❚❚' : '►';
  $('handles').classList.toggle('hide', playing);
}
$('play').onclick = () => { engine.toggle(); syncPlayUI(); };
canvas.addEventListener('click', () => {
  if (engine.isPlaying()) { engine.pause(); syncPlayUI(); }
});
$('modebtn').onclick = () => {
  mode = mode === 'light' ? 'dark' : 'light';
  $('modebtn').textContent = mode === 'dark' ? '◑ Dark' : '◐ Light';
  renderPoints(); pushCfg();
};

// ---- point handles + swatches ----------------------------------------------
function renderPoints() {
  const layer = $('handles');
  layer.innerHTML = '';
  config.points.forEach((p, i) => {
    const h = document.createElement('button');
    h.className = 'handle' + (i === selected ? ' on' : '');
    h.style.left = (p.x * 100) + '%';
    h.style.top = (p.y * 100) + '%';
    h.style.setProperty('--c', pointColor(p));
    h.addEventListener('pointerdown', (e) => startDrag(e, i, h));
    layer.appendChild(h);
  });
  const sw = $('swatches');
  sw.innerHTML = '';
  config.points.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (i === selected ? ' on' : '');
    b.style.setProperty('--c', pointColor(p));
    b.onclick = () => { selected = i; renderPoints(); };
    sw.appendChild(b);
  });
  const p = config.points[selected];
  $('clight').value = p.color;
  $('cdark').value = resolveDark(p);
  $('cauto').style.opacity = p.darkColor ? 1 : 0.4;
}

function startDrag(e, i, h) {
  e.preventDefault();
  selected = i;
  renderPoints();
  const rect = $('stage').getBoundingClientRect();
  const move = (ev) => {
    const x = Math.min(1.35, Math.max(-0.35, (ev.clientX - rect.left) / rect.width));
    const y = Math.min(1.35, Math.max(-0.35, (ev.clientY - rect.top) / rect.height));
    config.points[i].x = x;
    config.points[i].y = y;
    h.style.left = (x * 100) + '%';
    h.style.top = (y * 100) + '%';
    pushCfg();
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

$('clight').oninput = (e) => { config.points[selected].color = e.target.value; renderPoints(); pushCfg(); };
$('cdark').oninput = (e) => { config.points[selected].darkColor = e.target.value; renderPoints(); pushCfg(); };
$('cauto').onclick = () => { delete config.points[selected].darkColor; renderPoints(); pushCfg(); };

// ---- sliders ----------------------------------------------------------------
const SLIDERS = [
  ['Speed', 'animation', 'speed', 0, 3, 0.01],
  ['Warp', 'animation', 'warp', 0, 2, 0.01],
  ['Flow scale', 'animation', 'noiseScale', 0.2, 4, 0.01],
  ['Flow speed', 'animation', 'noiseSpeed', 0, 0.6, 0.005],
  ['Softness', 'effects', 'falloff', 0.6, 2.2, 0.01],
  ['Grain', 'effects', 'grain', 0, 0.3, 0.005],
];
function renderSliders() {
  const host = $('sliders');
  host.innerHTML = '';
  for (const [label, group, key, min, max, step] of SLIDERS) {
    const row = document.createElement('div');
    row.className = 'sld';
    const out = document.createElement('output');
    const input = document.createElement('input');
    input.type = 'range'; input.min = min; input.max = max; input.step = step;
    input.value = config[group][key];
    out.value = (+config[group][key]).toFixed(2);
    input.oninput = () => {
      config[group][key] = +input.value;
      out.value = (+input.value).toFixed(2);
      pushCfg();
    };
    const span = document.createElement('span');
    span.textContent = label;
    row.append(span, input, out);
    host.appendChild(row);
  }
}

// ---- presets ----------------------------------------------------------------
function renderPresets() {
  const sel = $('preset');
  sel.innerHTML = '<option value="">Presets…</option>';
  for (const name of Object.keys(PRESETS)) sel.add(new Option(name, 'b:' + name));
  for (const name of Object.keys(userPresets)) sel.add(new Option(name + ' (saved)', 'u:' + name));
}
$('preset').onchange = () => {
  const v = $('preset').value;
  if (!v) return;
  const src = v[0] === 'b' ? PRESETS[v.slice(2)] : userPresets[v.slice(2)];
  if (src) {
    const frame = config.frame;
    config = JSON.parse(JSON.stringify(src));
    if (!config.frame) config.frame = frame;
    selected = 0;
    const usingTokens = pulledPalette && pulledPalette.length;
    if (usingTokens) applyPulledPalette(); // preset = layout/motion, tokens = color
    applyAll();
    if (usingTokens) setStatus('Preset layout loaded with your token colors. (Unlink Variables to use preset colors.)');
  }
  $('preset').value = '';
};
$('savepreset').onclick = () => {
  const name = prompt('Save preset as:');
  if (!name) return;
  userPresets[name] = JSON.parse(JSON.stringify(config));
  post({ type: 'save-presets', presets: userPresets });
  renderPresets();
  setStatus('Preset saved.');
};

// ---- Figma actions ----------------------------------------------------------
$('importsel').onclick = () => {
  if (!IN_FIGMA) return setStatus('Import needs to run inside Figma.', true);
  setStatus('Reading selection…');
  post({ type: 'import-selection' });
};

// When a custom shader mapping is captured, Apply targets the user's own
// shader (e.g. the bundled custom-shader/, which animates on the canvas)
// instead of the stock account-library mesh shader.
let customShaderMap = null;

function updateShaderTarget() {
  $('shadertarget').textContent = customShaderMap
    ? 'target: your custom shader'
    : 'target: stock mesh';
}

const LATTICE = [0, 33, 67, 100];
const NUM_DEFAULTS = { 128: 'tessellation', 0.6: 'speed', 0.5: 'warp', 1.2: 'flowScale' };
function deriveShaderMap(id, properties) {
  const slots = new Array(16).fill(null);
  const nums = {};
  for (const key in properties) {
    const v = properties[key];
    if (v && typeof v === 'object' && typeof v.x === 'number') {
      for (let i = 0; i < 16; i++) {
        if (Math.abs(v.x - LATTICE[i % 4]) < 1.5 && Math.abs(v.y - LATTICE[(i / 4) | 0]) < 1.5) {
          slots[i] = key;
          break;
        }
      }
    } else if (typeof v === 'number') {
      for (const d in NUM_DEFAULTS) {
        if (Math.abs(v - +d) < 0.001) { nums[NUM_DEFAULTS[d]] = key; break; }
      }
    }
  }
  if (slots.some((s) => !s)) return null; // needs the shader at default positions
  return { id, slots, nums };
}

function buildCustomPaint() {
  const m = customShaderMap;
  const properties = {};
  config.points.forEach((p, i) => {
    const [r, g, b] = hexToRgb01(p.color);
    properties[m.slots[i]] = { x: p.x * 100, y: p.y * 100, color: { r, g, b, a: 1 } };
  });
  if (m.nums.tessellation) properties[m.nums.tessellation] = 128;
  if (m.nums.speed) properties[m.nums.speed] = config.animation.speed;
  if (m.nums.warp) properties[m.nums.warp] = config.animation.warp;
  if (m.nums.flowScale) properties[m.nums.flowScale] = config.animation.noiseScale;
  return { type: 'SHADER', visible: true, opacity: 1, blendMode: 'NORMAL', id: m.id, properties };
}

$('captureshader').onclick = () => {
  if (!IN_FIGMA) return setStatus('Capture needs to run inside Figma.', true);
  setStatus('Reading selection’s shader…');
  post({ type: 'capture-shader' });
};

$('applymesh').onclick = () => {
  try {
    if (config.mode !== 'mesh' || config.points.length !== 16) {
      throw new Error('Figma shader export requires mesh mode with 16 grid points.');
    }
    const paint = customShaderMap ? buildCustomPaint() : configToFigmaShaderPaint(config);
    if (!IN_FIGMA) return setStatus('Apply needs to run inside Figma.', true);
    post({ type: 'apply-shader', paint });
  } catch (err) {
    setStatus(err.message, true); // e.g. not in mesh mode
  }
};

$('applyimg').onclick = () => {
  if (!IN_FIGMA) return setStatus('Apply needs to run inside Figma.', true);
  setStatus('Checking selection…');
  post({ type: 'image-size-request' });
};

$('mkvars').onclick = () => {
  if (!IN_FIGMA) return setStatus('Variables need to run inside Figma.', true);
  const palette = config.points.map((p, i) => ({
    name: 'mesh/point-' + String(i + 1).padStart(2, '0'),
    light: p.color,
    dark: resolveDark(p),
  }));
  post({ type: 'make-variables', palette });
};

// ---- variable collection link: pull/push point colors from Figma variables --
// The last pulled token palette is the ACTIVE palette: it tiles across all
// points of the current design and re-applies whenever a preset loads, so
// presets supply layout/motion while the tokens supply color.
let pulledPalette = null;
function applyPulledPalette() {
  if (!pulledPalette || !pulledPalette.length) return;
  config.points.forEach((p, i) => {
    const v = pulledPalette[i % pulledPalette.length];
    p.color = rgb01ToHex(v.light.r, v.light.g, v.light.b);
    if (v.dark) p.darkColor = rgb01ToHex(v.dark.r, v.dark.g, v.dark.b);
    else delete p.darkColor;
  });
}
$('varcol').onchange = () => {
  const id = $('varcol').value;
  if (!IN_FIGMA) return setStatus('Variables need to run inside Figma.', true);
  post({ type: 'link-collection', collectionId: id || null });
  if (!id) { $('varmodes').hidden = true; $('varmodes').innerHTML = ''; pulledPalette = null; }
  setStatus(id
    ? 'Linked. Pull loads its Light/Dark values; Push writes edits back. (Figma can’t bind shader colors to variables yet — this sync is the bridge; re-pull after token changes.)'
    : 'Variables unlinked.');
};
$('pullvars').onclick = () => {
  if (!IN_FIGMA) return setStatus('Variables need to run inside Figma.', true);
  if (!$('varcol').value) return setStatus('Link a variable collection first.', true);
  setStatus('Resolving variables…');
  post({ type: 'pull-variables' });
};

// ---- web tool sync (optional — needs serve.py running) ----------------------
const WEB_BASE = 'http://localhost:5599';
$('pullweb').onclick = async () => {
  try {
    const data = await (await fetch(WEB_BASE + '/api/design')).json();
    const paint = data && data.payload && data.payload.paint;
    if (!paint) return setStatus('Web tool has no mesh design published.', true);
    const frame = (data.payload.frame) || { width: 1440, height: 580 };
    config = figmaShaderToConfig(paint.properties, frame);
    config.frame = frame;
    selected = 0;
    applyAll();
    setStatus('Loaded the web tool’s current design.');
  } catch (e) {
    setStatus('Web tool not reachable — run "python3 serve.py 5599".', true);
  }
};
$('sendweb').onclick = async () => {
  try {
    const paint = configToFigmaShaderPaint(config);
    await fetch(WEB_BASE + '/api/inbox', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ width: config.frame.width, height: config.frame.height, properties: paint.properties }),
    });
    setStatus('Sent — an import banner appears in the web tool.');
  } catch (e) {
    setStatus(e.message.includes('mesh') ? e.message : 'Web tool not reachable — run "python3 serve.py 5599".', true);
  }
};

// ---- code exports -----------------------------------------------------------
function standaloneJS() {
  const cfg = engine.getConfig();
  return '/* Animated mesh gradient - self-contained, no dependencies.\n' +
    '   Add <canvas id="gradient" style="width:100%;height:100vh"></canvas> to your page. */\n' +
    '(function (root) {\n' + ENGINE_SRC + '\n' +
    'var CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n' +
    'function boot() { var c = document.getElementById("gradient"); if (c) root.meshGradient = initMeshGradient(c, CONFIG); }\n' +
    'if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", boot); } else { boot(); }\n' +
    'root.initMeshGradient = initMeshGradient;\n' +
    '})(typeof window !== "undefined" ? window : this);\n';
}
function standaloneHTML() {
  const js = standaloneJS().replace(/<\/script/gi, '<\\/script');
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Mesh Gradient</title>\n' +
    '<style>html,body{margin:0;height:100%}#gradient{display:block;width:100vw;height:100vh}</style>\n' +
    '</head>\n<body>\n<canvas id="gradient"></canvas>\n<script>\n' + js + '\n</scr' + 'ipt>\n</body>\n</html>\n';
}
function copyText(text, label) {
  const ta = $('clip');
  ta.value = text;
  ta.select();
  try {
    document.execCommand('copy');
    setStatus(label + ' copied to clipboard.');
  } catch (e) {
    setStatus('Copy failed: ' + e.message, true);
  }
  ta.blur();
}
$('copyjs').onclick = () => copyText(standaloneJS(), 'JS drop-in');
$('copyhtml').onclick = () => copyText(standaloneHTML(), 'HTML page');

// ---- messages from the Figma main thread ------------------------------------
window.onmessage = async (event) => {
  const msg = event.data && event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'status') {
    setStatus(msg.error || msg.ok, !!msg.error);

  } else if (msg.type === 'presets') {
    userPresets = msg.presets || {};
    renderPresets();

  } else if (msg.type === 'shader-map') {
    customShaderMap = msg.map || null;
    updateShaderTarget();

  } else if (msg.type === 'collections') {
    const sel = $('varcol');
    sel.innerHTML = '<option value="">Variables: not linked</option>';
    for (const c of msg.list) {
      sel.add(new Option(c.name + ' (' + c.colorCount + ' colors)', c.id));
    }
    if (msg.linkedId) sel.value = msg.linkedId;
    setStatus('Ready (v' + PANEL_VERSION + ') — ' + msg.list.length + ' variable collection(s) found.');

  } else if (msg.type === 'collection-modes') {
    // The linked collection's aliases pass through collections with their own
    // themes (multiple modes, none named light/dark) — render a picker for
    // each so the user chooses which theme the Light/Dark values resolve in.
    const host = $('varmodes');
    host.innerHTML = '';
    host.hidden = !msg.hops.length;
    for (const hop of msg.hops) {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('span');
      label.className = 'lbl';
      label.textContent = hop.name + ' theme';
      const sel = document.createElement('select');
      for (const m of hop.modes) sel.add(new Option(m.name, m.modeId));
      sel.value = (msg.overrides && msg.overrides[hop.id]) || hop.defaultModeId;
      sel.onchange = () => {
        post({ type: 'set-mode-override', collectionId: hop.id, modeId: sel.value });
        setStatus('Theme set — Pull colors to re-resolve.');
      };
      row.append(label, sel);
      host.appendChild(row);
    }

  } else if (msg.type === 'variables-pulled') {
    pulledPalette = msg.palette.filter((v) => v.light);
    if (!pulledPalette.length) {
      pulledPalette = null;
      return setStatus('No resolvable colors in that collection.', true);
    }
    applyPulledPalette();
    renderPoints();
    pushCfg();
    setStatus('Applied ' + pulledPalette.length + ' token colors across ' + config.points.length +
      ' points. Pick any preset — its layout loads with these colors.');

  } else if (msg.type === 'shader-captured') {
    const map = deriveShaderMap(msg.id, msg.properties);
    if (!map) {
      setStatus('Couldn’t map that shader — apply it with DEFAULT point positions first, then capture.', true);
    } else {
      customShaderMap = map;
      post({ type: 'save-shader-map', map });
      updateShaderTarget();
      setStatus('Apply now targets your shader (' + Object.keys(map.nums).length + ' animation params mapped).');
    }

  } else if (msg.type === 'selection-mesh') {
    // properties + node size + optional PNG reference for topology refinement
    let cfg = figmaShaderToConfig(msg.properties, { width: msg.width, height: msg.height });
    if (cfg.mode === 'mesh' && msg.refBytes) {
      try {
        const blob = new Blob([new Uint8Array(msg.refBytes)], { type: 'image/png' });
        const url = URL.createObjectURL(blob);
        const refined = await refineGridOrderByReference(cfg.points, url);
        cfg.points = refined.points;
        URL.revokeObjectURL(url);
      } catch (e) { /* fall back to the analytic recovery */ }
    }
    config = cfg;
    config.frame = { width: msg.width, height: msg.height };
    selected = 0;
    applyAll();
    setStatus('Imported ' + config.points.length + '-point mesh from selection.');

  } else if (msg.type === 'image-size') {
    setStatus('Rendering frame…');
    const blob = await engine.capture(msg.width, msg.height);
    syncPlayUI(); // capture pauses
    const bytes = new Uint8Array(await blob.arrayBuffer());
    post({ type: 'apply-image', bytes });
  }
};

// ---- boot -------------------------------------------------------------------
function applyAll() {
  mode = 'light';
  $('modebtn').textContent = '◐ Light';
  pushCfg();
  renderPoints();
  renderSliders();
  syncPlayUI();
}
applyAll();
renderPresets();
updateShaderTarget();
post({ type: 'get-presets' });
post({ type: 'get-shader-map' });
post({ type: 'get-collections' });
if (!IN_FIGMA) setStatus('Browser test mode — Figma actions disabled.');

</script>
